<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo de Solow · renda observada e prevista</title>
<meta name="description" content="Renda per capita observada e prevista pelo modelo de Solow e pelo modelo aumentado de Mankiw, Romer e Weil, com dados da Penn World Table 11.0.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root{
  --bg:#FFFFFF; --ink:#111214; --muted:#6E7278; --hair:#E4E6E8; --grid:#E9EBED;
  --acima:#24589A; --abaixo:#B23A2E;
  --chip:#F4F5F6; --semdado:#FFFFFF; --mar:#EEF2F6; --borda:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;font-size:15.5px;line-height:1.6;
  font-feature-settings:"tnum" 1}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:0 0 10px}
.topo h1{margin:0;flex:1}
.langbar{display:flex;gap:4px;flex-shrink:0;padding-top:6px}
.lang{font:inherit;font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer;
  color:var(--muted);background:none;border:1px solid var(--hair);border-radius:999px}
.lang:hover{color:var(--ink);border-color:#CFD3D8}
.lang.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{max-width:1150px;margin:0 auto;padding:26px clamp(16px,3.5vw,40px) 80px}

h1{font-family:Newsreader,Georgia,serif;font-weight:700;font-variation-settings:"opsz" 46;
  font-size:clamp(28px,4.4vw,44px);line-height:1.06;letter-spacing:-.015em;margin:0 0 10px;
  text-wrap:balance}
.standfirst{font-size:17px;color:#3A3E44;max-width:76ch;margin:0}
.standfirst a{color:inherit;text-decoration:underline;text-decoration-color:#B9BDC2;text-underline-offset:3px}

.comoler{margin:26px 0 0;padding:2px 0 2px 16px;border-left:3px solid var(--acima);
  font-size:14px;color:#3A3E44;max-width:82ch;line-height:1.65}
.comoler b{font-weight:600;color:var(--ink)}

/* controles */
.controles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px 36px;margin:28px 0 6px;padding:18px 0 4px;border-top:1px solid var(--ink)}
.grupo{display:flex;flex-direction:column;gap:8px}
.grupo>a{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;border-bottom:1px dotted #B9BDC2;width:max-content;cursor:help}
.grupo>a:hover{color:var(--ink)}
.grupo.largo{grid-column:span 2}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font:inherit;font-size:12.5px;font-weight:500;padding:6px 14px;cursor:pointer;
  color:#3A3E44;background:var(--bg);border:1px solid #CFD3D8;border-radius:999px;white-space:nowrap}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.seg button:disabled{opacity:.35;cursor:not-allowed;border-color:#CFD3D8}
.seg button:focus-visible{outline:2px solid var(--acima);outline-offset:2px}

/* busca */
.busca{position:relative;margin:26px 0 0}
.busca input{width:100%;font:inherit;font-size:17px;padding:12px 46px 12px 42px;
  border:1px solid #CFD3D8;border-radius:10px;background:var(--bg);color:var(--ink)}
.busca input:focus{outline:none;border-color:var(--ink)}
.busca svg.lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--muted);fill:none;stroke-width:2}
.busca .abre{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;
  border:0;background:none;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
.busca .abre:hover{background:var(--chip)}
.busca .abre svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
.busca.mini{margin:0;width:300px;max-width:100%}
.busca.mini input{font-size:14px;padding:8px 40px 8px 36px;border-radius:999px}
.busca.mini .lupa{left:12px;width:16px;height:16px}
.busca.mini .abre{width:30px;height:30px}
.sugest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg);z-index:20;
  border:1px solid #CFD3D8;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);
  list-style:none;margin:0;padding:4px 0;max-height:280px;overflow:auto;display:none}
.sugest li{padding:8px 16px;cursor:pointer;font-size:14.5px;display:flex;justify-content:space-between;gap:12px}
.sugest li span{color:var(--muted);font-size:12.5px}
.sugest li[aria-selected="true"],.sugest li:hover{background:var(--chip)}

/* cartao do pais */
.pais{margin:22px 0 0;padding:20px 0 0;border-top:1px solid var(--hair)}
.pais-topo{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.pais h2{font-family:Newsreader,Georgia,serif;font-size:30px;font-weight:700;margin:0;letter-spacing:-.01em}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--hair);border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}
.tag.fora{color:#8a4b00;border-color:#E9C9A3;background:#FFF6E8}
.anosd{font-size:12.5px;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0 0}
.trio div{border-top:2px solid var(--ink);padding-top:8px}
.trio span{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
.trio b{font-size:28px;font-weight:700;letter-spacing:-.015em;display:block;line-height:1.25}
.trio small{font-size:12.5px;color:var(--muted)}
.trio .pos b{color:var(--acima)} .trio .neg b{color:var(--abaixo)}
.trio .pos{border-color:var(--acima)} .trio .neg{border-color:var(--abaixo)}

/* barra de diferenca */
.barra-topo{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 7px}
.barra{position:relative;height:30px;display:flex;align-items:center}
.barra::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);z-index:3}
.lado{flex:1;height:20px;display:flex;position:relative}
.lado.esq{justify-content:flex-end}
.trilho{position:absolute;inset:0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.fill{height:100%;width:0;transition:width .7s cubic-bezier(.22,1,.36,1)}
.fill.b{background:var(--abaixo)} .fill.a{background:var(--acima)}
.escala{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}

.duas{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;margin:26px 0 0}
.bloco h3{font-size:15px;font-weight:700;margin:0 0 4px}
.bloco p.sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.dados{width:100%;border-collapse:collapse;font-size:14px}
.dados td{padding:6px 0;border-bottom:1px solid var(--hair)}
.dados td:last-child{text-align:right;font-weight:600}
.dados td small{color:var(--muted);font-weight:400}
.decomp .lin{display:grid;grid-template-columns:150px 1fr 74px;align-items:center;gap:10px;font-size:13.5px;margin:0 0 9px}
.decomp .trk{position:relative;height:16px}
.decomp .trk::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#9CA1A7}
.decomp .bar{position:absolute;top:0;height:16px;transition:all .6s cubic-bezier(.22,1,.36,1)}
.decomp .v{text-align:right;font-weight:600}
.decomp .tot{border-top:1px solid var(--ink);padding-top:9px;font-weight:700}

/* figuras */
figure{margin:40px 0 0}
.figtit{font-size:15px;font-weight:700;margin:0 0 4px}
.figsub{font-size:13px;color:var(--muted);margin:0 0 10px}
svg{display:block;width:100%;height:auto;overflow:visible}
.eixo{font-size:11px;fill:var(--muted);font-family:Inter,sans-serif}
.eixo.t{font-size:11.5px;font-weight:600;fill:#3A3E44}
.grade{stroke:var(--grid);stroke-width:1}
.diag{stroke:#9CA1A7;stroke-width:1.2;stroke-dasharray:4 4}
.mapbox{position:relative;background:var(--mar);border-radius:14px;overflow:hidden}
.mapbox:fullscreen{border-radius:0;display:flex;flex-direction:column;justify-content:center}
.mapbox svg{cursor:grab}
.mapbox svg:active{cursor:grabbing}
.oceano{fill:var(--mar)}
.grat{fill:none;stroke:#DCE3EA;stroke-width:.6;vector-effect:non-scaling-stroke}
.pais-geo{stroke:var(--borda);stroke-width:.55;vector-effect:non-scaling-stroke;cursor:pointer;transition:filter .15s}
.pais-geo.sd{stroke:#D6DBE1}
.pais-geo:hover{filter:brightness(1.08) saturate(1.1)}
.hach{pointer-events:none}
.pin circle{fill:var(--ink);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.pin text{font-size:13px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid #D6DBE1;background:rgba(255,255,255,.92);
  font:inherit;font-size:18px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom button:hover{background:#fff;border-color:var(--ink)}
.zoom svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
.dica{position:absolute;left:14px;bottom:8px;margin:0;font-size:11.5px;color:var(--muted)}
.destaques{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:12.5px;font-weight:500;padding:4px 8px 4px 12px;border-radius:999px;cursor:pointer;
  border:1px solid #CFD3D8;background:var(--bg);color:#3A3E44;display:flex;align-items:center;gap:6px}
.chips button:hover{border-color:var(--ink)}
.chips button span{font-size:14px;line-height:1;color:var(--muted)}
.chips button.atual{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button.atual span{color:#fff}
.lbl-disp{font-size:12px;font-weight:600;fill:#3A3E44;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.ponto{cursor:pointer}
.ponto.sel{stroke:var(--ink);stroke-width:2}
.lbl-sel{font-size:12.5px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.legenda{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:10px 0 0;flex-wrap:wrap}
.legenda .rampa{height:10px;width:280px;border-radius:2px}
.legenda .sw{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:#fff;font-size:12.5px;
  padding:8px 11px;border-radius:7px;line-height:1.45;opacity:0;transition:opacity .12s;max-width:260px}
.tip b{font-weight:600}

/* ranking */
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin:40px 0 0}
.rank h3{font-size:15px;font-weight:700;margin:0 0 10px}
.rank ol{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:22px 1fr 70px;gap:8px;align-items:center;padding:6px 0;
  border-bottom:1px solid var(--hair);font-size:14px;cursor:pointer}
.rank li:hover{background:var(--chip)}
.rank li .i{color:var(--muted);font-size:12px}
.rank li .v{text-align:right;font-weight:600}
.rank.pos li .v{color:var(--acima)} .rank.neg li .v{color:var(--abaixo)}


/* rodape */
.rodape{margin-top:60px;border-top:3px solid var(--ink);padding-top:26px}
.rodape>div+div{margin-top:44px;padding-top:30px;border-top:1px solid var(--hair)}
.rodape h2{font-family:Newsreader,Georgia,serif;font-size:24px;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}
.rodape h3{font-size:14px;font-weight:600;margin:18px 0 5px;scroll-margin-top:20px}
.rodape p{margin:0 0 10px;font-size:14px;color:#3A3E44;max-width:92ch}
.eqrow{margin:14px 0;overflow-x:auto;max-width:92ch}
.eqrow .katex{font-size:1.06em}
.ref{font-size:12.5px;color:var(--muted);margin:0 0 6px;padding-left:22px;text-indent:-22px}
.baixar{margin-top:24px}
.baixar button{font:inherit;font-size:12.5px;font-weight:600;padding:10px 18px;
  background:var(--ink);color:var(--bg);border:0;border-radius:8px;cursor:pointer}
.baixar button:hover{background:#000}
.fonte{font-size:12px;color:var(--muted);margin-top:40px;padding-top:12px;border-top:1px solid var(--hair)}
:target{background:#FFF6E8;transition:background 1.5s}

@media (max-width:760px){
  .topo{flex-direction:column-reverse;gap:12px}
  .langbar{align-self:flex-end;padding-top:0}
  .grupo.largo{grid-column:auto}
  .trio{grid-template-columns:1fr}
  .duas,.ranks{grid-template-columns:1fr;gap:28px}
  .decomp .lin{grid-template-columns:110px 1fr 64px}
  .legenda .rampa{width:160px}
  .dica{display:none}
  .busca.mini{width:100%}
}
@media (prefers-reduced-motion:reduce){.fill,.decomp .bar{transition:none}html{scroll-behavior:auto}}
</style>
</head>
